{% extends "base.html" %}{% block title %}Post a Job | Online Job Portal{% endblock %}{% block content %}<style>.form{max-width:920px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dfe4ed;border-radius:8px}.field textarea{height:130px}.full{grid-column:1/-1}@media(max-width:650px){.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style><main class="container form card"><h1>Post a Job</h1><p class="muted">Reach candidates across India.</p><br><form method="post">{% csrf_token %}<div class="fields"><div class="field"><label>Job Title *</label><input name="title" required></div><div class="field"><label>Company *</label><input name="company" required></div><div class="field"><label>City *</label><input name="location" required></div><div class="field"><label>State *</label><input name="state" required></div><div class="field"><label>Job Type *</label><select name="job_type" required><option value="">Select</option><option>Full Time</option><option>Part Time</option><option>Internship</option><option>Remote</option></select></div><div class="field"><label>Experience *</label><input name="experience" required placeholder="Fresher / 1-3 years"></div><div class="field"><label>Category *</label><input name="category" required placeholder="Technology"></div><div class="field"><label>Salary</label><input name="salary" placeholder="₹3-6 LPA"></div><div class="field full"><label>Skills *</label><input name="skills" required placeholder="Python, Django, SQL"></div><div class="field full"><label>Description *</label><textarea name="description" required></textarea></div></div><button class="btn">Publish Job</button></form></main>{% endblock %}
