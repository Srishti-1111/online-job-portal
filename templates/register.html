{% extends "base.html" %}{% block title %}Register | Online Job Portal{% endblock %}{% block content %}<main class="container card" style="max-width:470px;margin:45px auto"><h1>Create Account</h1><p class="muted">Start your job search across India.</p>{% if messages %}{% for m in messages %}<p style="color:#b42318">{{m}}</p>{% endfor %}{% endif %}<form method="post">{% csrf_token %}<label>Username</label><input style="width:100%;padding:12px;margin:6px 0 12px" name="username" required><label>Email</label><input style="width:100%;padding:12px;margin:6px 0 12px" type="email" name="email" required><label>Password</label><input style="width:100%;padding:12px;margin:6px 0 12px" type="password" name="password" required><label>Confirm Password</label><input style="width:100%;padding:12px;margin:6px 0 12px" type="password" name="confirm" required><button class="btn" style="width:100%">Create Account</button></form></main>{% endblock %}
